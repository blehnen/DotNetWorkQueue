# Version updates for the commit-SHA pins in .github/workflows. GitHub Actions only:
# NuGet comes from batch update PRs plus Dependabot security updates (the TFM-conditional
# pins in Source/Directory.Packages.props do not suit automated bumps), and the Docker base
# images use floating tags that already pick up patches.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      # Minor and patch bumps arrive together in one PR a month. Major bumps are left out of
      # the group, so each opens its own PR: a new major can change inputs or the runtime,
      # and gets its own review and Jenkins run.
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

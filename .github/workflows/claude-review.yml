name: Claude PR review

# A second opinion on pull requests, alongside CodeRabbit. It is deliberately a
# supplement rather than a replacement: most changes here are authored with Claude,
# so this reviewer shares the author's priors even though it does not share the
# authoring session's context. A differently-built reviewer catches things it will
# not, and the reverse is also true.
#
# Authentication is a Claude subscription via CLAUDE_CODE_OAUTH_TOKEN, generated
# with `claude setup-token`.
#
# Fork pull requests are skipped explicitly. GitHub does not pass repository
# secrets to them, so the action would run, find no token and fail on every such
# pull request - a red check that says nothing about the change. The condition on
# the job turns that into not running at all. Note this differs from the other
# workflows here, which do run for fork pull requests; they need no secret to be
# useful, and they run on GitHub's throwaway runners rather than our own hardware.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Same-repository pull requests only - see the note above.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The branch is already checked out.

            Read CLAUDE.md first and treat it as authoritative. This repository has
            deliberate conventions that look like defects if you do not know them,
            and reporting one as a finding wastes a maintainer's time. Among them:

            - Integration test projects target net10.0 only, on purpose.
            - TreatWarningsAsErrors and XML documentation are enabled for the shipped
              library projects and deliberately not for test projects.
            - Test projects carry no licence header by design; do not ask for one.
            - Assertions are MSTest. FluentAssertions was removed on licensing
              grounds and must not be suggested.

            If something looks wrong, check whether it is established practice in the
            surrounding code before reporting it. Say so plainly when you are unsure
            rather than asserting it.

            Focus on what a careful reviewer would actually catch:

            - Correctness, especially edge cases and error handling
            - Concurrency and async: unawaited work, unobserved exceptions, races
            - Resources that can leak on a failure path
            - Tests that cannot fail, or that pass for a reason other than the one
              they claim to check
            - Security implications of the change

            Report findings as inline comments on the lines they concern, with one
            short top-level summary. Report nothing if the change is sound - silence
            is a useful signal and padding is not.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

name: .NET Framework smoke

# The netstandard2.0 packages are the only ones no other job runs. Everything else is tested on
# net10.0, where the framework supplies what that build has to polyfill, so none of the polyfilled
# code is ever executed - the regular expressions built at run time, the ADO.NET asynchronous
# transaction shims, the interval timer standing in for PeriodicTimer, and the AES-GCM
# implementation that framework has no equivalent for.
#
# It runs on Windows because a .NET Framework test host cannot run anywhere else, which is why
# neither Jenkins (Linux Docker agents) nor ci.yml (ubuntu-latest) can cover this. See GitHub #392.

on:
  push:
    branches: [ master, '*.*.x' ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Packing first is the point of this job. A ProjectReference would build the net10.0
      # assemblies and prove nothing about what a consumer receives; 0.6.6.1 shipped broken
      # because the package dropped DLLs the projects still had (GitHub #216).
      - name: Pack
        run: dotnet pack "Source/DotNetWorkQueueNoTests.sln" -c Release -p:CI=true -o "${{ runner.temp }}/feed"

      - name: Restore the smoke project from the packed output
        run: >
          dotnet restore "Source/DotNetWorkQueue.NetFramework.SmokeTests/DotNetWorkQueue.NetFramework.SmokeTests.csproj"
          -p:RestoreAdditionalProjectSources="${{ runner.temp }}/feed"

      - name: Build
        run: >
          dotnet build "Source/DotNetWorkQueue.NetFramework.SmokeTests/DotNetWorkQueue.NetFramework.SmokeTests.csproj"
          -c Release --no-restore

      - name: Test
        run: >
          dotnet test "Source/DotNetWorkQueue.NetFramework.SmokeTests/DotNetWorkQueue.NetFramework.SmokeTests.csproj"
          -c Release --no-build --logger "console;verbosity=normal"

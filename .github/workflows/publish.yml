name: Publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publish + release (exercises verify-gate, build-pack and the NuGet OIDC exchange). Used for the operational dry-run.'
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Permissions are declared per job rather than at workflow level, so each job states
# exactly what it needs (githubactions:S8264). Every job must set them -- with no
# workflow-level block, an unset job falls back to the repository default, which may
# be broader than contents: read.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  verify-gate:
    name: Verify tag, version, and Jenkins status
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read       # reads the Jenkins branch status on the tagged commit
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Tag regex (push trigger only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9\.-]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match ^v[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9\\.-]+)?\\$"
            exit 1
          fi
          echo "Tag '${GITHUB_REF_NAME}' matches regex."

      - name: Tag-version match (push trigger only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Source/Directory.Build.props)
          if [[ "${TAG_VERSION}" != "${PROP_VERSION}" ]]; then
            echo "::error::Tag '${TAG_VERSION}' does not match Directory.Build.props '<Version>${PROP_VERSION}</Version>'"
            exit 1
          fi
          echo "Tag version '${TAG_VERSION}' matches Directory.Build.props."

      - name: Jenkins B2 gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
            --jq '.statuses[] | select(.context=="continuous-integration/jenkins/branch") | .state')
          if [[ "${state}" != "success" ]]; then
            echo "::error::Jenkins status on ${{ github.sha }} is '${state:-missing}'; required 'success'"
            exit 1
          fi
          echo "Jenkins 'continuous-integration/jenkins/branch' status is 'success' on ${{ github.sha }}."

  build-pack:
    name: Build, pack, and upload NuGet packages
    needs: verify-gate
    permissions:
      contents: read
    uses: ./.github/workflows/build-pack.yml
    with:
      upload_artifacts: true

  # A dry run skips the publish job, so without this nothing would exercise the
  # OIDC exchange until a real tag - the worst moment to discover the policy names
  # the wrong workflow, or the profile name is wrong, or id-token is missing.
  # This proves the exchange and the repository/workflow policy. It cannot prove
  # the per-package policies: those are only tested by an actual push.
  verify-trusted-publishing:
    name: Verify the NuGet OIDC exchange (dry run only)
    needs: verify-gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: NuGet login (OIDC exchange for a short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: blehnen

      - name: Report
        env:
          MINTED: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$MINTED" ]; then
            echo "OIDC exchange produced no key" >&2
            exit 1
          fi
          {
            echo "## Trusted publishing"
            echo ""
            echo "- OIDC exchange succeeded; a short-lived key was issued"
            echo "- Per-package policies are NOT proven by this job; only a real push tests those"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Push to NuGet.org and create GitHub Release
    needs: build-pack
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    # Elevated permission scoped to this job only (contents:write is needed
    # by gh release create; verify-gate and build-pack run with contents:read).
    # id-token:write is what lets the runner mint an OIDC token for the NuGet
    # trusted-publishing exchange below - without it the login step fails with a
    # message that does not mention permissions.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout (for gh release create)
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: deploy/

      # Trusted publishing: swap the run's OIDC token for an API key that is valid
      # for one hour and only for this repository and workflow. There is no durable
      # credential to leak or rotate. Three things here are load-bearing:
      #   - `user` is the nuget.org PROFILE name, not the account email
      #   - the exchange happens immediately before the push; one OIDC token buys
      #     exactly one key, so this step cannot be hoisted into another job
      #   - the key reaches the push through `env:` rather than being interpolated
      #     into the `run:` line, which is what Sonar githubactions:S7636 is about
      # The nuget.org policy is registered against THIS workflow file. Moving the
      # push to another workflow silently invalidates it.
      - name: NuGet login (OIDC exchange for a short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: blehnen

      # The nupkg and snupkg pushes are deliberately split into two commands.
      # The dotnet CLI's auto-match of .snupkg alongside .nupkg is unreliable
      # on Windows (CLAUDE.md lesson). Splitting is also easier to diagnose
      # if one half fails — the failing step is immediately obvious.
      # The ubuntu-latest runner has dotnet preinstalled so no setup-dotnet
      # action is needed for `dotnet nuget push`.
      - name: Push .nupkg to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "deploy/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push .snupkg to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "deploy/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            deploy/*.nupkg deploy/*.snupkg \
            --title "DotNetWorkQueue ${{ github.ref_name }}" \
            --generate-notes

      - name: Job summary
        run: |
          {
            echo "## Publish summary"
            echo ""
            echo "- Tag: ${{ github.ref_name }}"
            echo "- NuGet feed: https://api.nuget.org/v3/index.json"
            echo "- Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-publish:
    name: Build and push dashboard Docker image
    needs: publish
    permissions:
      contents: read
    # Same dry-run semantics as the NuGet publish job: skipped entirely when
    # workflow_dispatch is invoked with dry_run=true.
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/dashboard/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            blehnen74/dotnetworkqueue-dashboard:${{ steps.ver.outputs.version }}
            blehnen74/dotnetworkqueue-dashboard:latest

      - name: Job summary
        run: |
          {
            echo "## Docker publish summary"
            echo ""
            echo "- Image: blehnen74/dotnetworkqueue-dashboard"
            echo "- Tags pushed: ${{ steps.ver.outputs.version }}, latest"
            echo "- Platforms: linux/amd64"
          } >> "$GITHUB_STEP_SUMMARY"
